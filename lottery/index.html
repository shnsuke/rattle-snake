<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2340">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="くじ引き">
  <title>くじ引き</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>くじ引き</h1>
    <span id="offline-badge" class="badge" hidden>オフライン</span>
  </header>

  <main>
    <!-- 設定画面 -->
    <section id="setup" class="screen">
      <div class="card">
        <label class="row">
          <span class="row-label">人数</span>
          <span class="stepper">
            <button type="button" data-step="people" data-delta="-1" aria-label="人数を減らす">−</button>
            <input id="people" type="number" inputmode="numeric" min="1" max="200" value="4">
            <button type="button" data-step="people" data-delta="1" aria-label="人数を増やす">＋</button>
          </span>
        </label>
        <label class="row">
          <span class="row-label">選択肢の数</span>
          <span class="stepper">
            <button type="button" data-step="options" data-delta="-1" aria-label="選択肢を減らす">−</button>
            <input id="options" type="number" inputmode="numeric" min="1" max="30" value="2">
            <button type="button" data-step="options" data-delta="1" aria-label="選択肢を増やす">＋</button>
          </span>
        </label>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>選択肢</h2>
          <label class="toggle">
            <input id="manual-count" type="checkbox" checked>
            <span>本数を指定</span>
          </label>
        </div>
        <p class="hint" id="count-hint">人数を選択肢に均等に割り振ります（余りはランダム）。</p>
        <ol id="option-list" class="option-list"></ol>
        <p id="count-status" class="count-status" hidden></p>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>参加者の名前 <small>（任意）</small></h2>
        </div>
        <textarea id="names" rows="3" placeholder="1行に1人。空欄なら「1番」「2番」…"></textarea>
      </div>

      <button id="start" class="primary big" type="button">くじを作る</button>
    </section>

    <!-- 抽選画面 -->
    <section id="draw" class="screen" hidden>
      <p class="hint center">自分のくじをタップして開いてください</p>
      <div id="tickets" class="tickets"></div>
      <div class="actions">
        <button id="reveal-all" type="button">全部開く</button>
        <button id="show-summary" type="button">結果一覧</button>
      </div>
      <div class="actions">
        <button id="redraw" type="button">同じ条件で引き直す</button>
        <button id="back" type="button">設定に戻る</button>
      </div>
    </section>

    <!-- 結果一覧 -->
    <section id="summary" class="screen" hidden>
      <div id="summary-body"></div>
      <div class="actions">
        <button id="summary-back" type="button">くじに戻る</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
